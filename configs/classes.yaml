# Классы объектов и коды дефектов.
# ШАБЛОН: в «день 0» (tasks/00_day0_checklist.md) привести в соответствие с реальным датасетом.
# Порядок классов = class_id в YOLO-разметке. После изменения порядка модель надо переобучать.

classes:
  - id: 0
    name: cable_manhole        # кабельный колодец / люк
    title_ru: "Кабельный колодец"
    criticality: 1.0           # вес при расчёте приоритета (0..1)
    defects: [cover_broken, cover_displaced, cover_missing, subsidence_around]
  - id: 1
    name: utility_pole         # опора (ЛЭП/связи)
    title_ru: "Опора"
    criticality: 0.8
    defects: [pole_tilt, pole_crack, corrosion, cable_sag]
  - id: 2
    name: cable_cabinet        # распределительный шкаф
    title_ru: "Распределительный шкаф"
    criticality: 0.7
    defects: [cabinet_open, cabinet_damaged, corrosion]

# Справочник дефектов. method: geometry | classifier | both
defects:
  cover_broken:      {title_ru: "Разрушена/треснула крышка люка",   method: both,       weight: 0.9}
  cover_displaced:   {title_ru: "Крышка смещена/неплотно закрыта", method: both,       weight: 0.8}
  cover_missing:     {title_ru: "Крышка отсутствует (открытый колодец)", method: classifier, weight: 1.0}
  subsidence_around: {title_ru: "Просадка/разрушение покрытия вокруг колодца", method: geometry, weight: 0.6}
  pole_tilt:         {title_ru: "Наклон опоры",                    method: geometry,   weight: 0.8}
  pole_crack:        {title_ru: "Трещины/сколы опоры",             method: both,       weight: 0.7}
  corrosion:         {title_ru: "Коррозия",                        method: both,       weight: 0.5}
  cable_sag:         {title_ru: "Провисание/обрыв кабеля",         method: classifier, weight: 0.8}
  cabinet_open:      {title_ru: "Шкаф открыт",                     method: classifier, weight: 0.6}
  cabinet_damaged:   {title_ru: "Повреждение шкафа",               method: classifier, weight: 0.6}
  generic_damage:    {title_ru: "Общее повреждение (бинарный классификатор)", method: classifier, weight: 0.6}
